<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Wordle: No Mercy — Results</title>

    <link
        rel="stylesheet"
        href="static/results.css"
    >

</head>

<body>

<main class="results-page">

    <div class="results-card">

        <div class="evil">
            EVIL WORDLE
        </div>

        <h1 id="mainMessage">
            Results
        </h1>


        <div
            id="resultSummary"
            class="result-summary"
        ></div>


        <div
            id="gameResults"
            class="game-results"
        ></div>


        <button

            class="share-btn"

        </button>


        <button
            id="playBtn"

    </div>

<script src="static/results.js"></script>

</html>
